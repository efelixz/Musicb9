version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voicify
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voicify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://voicify:password@db:5432/voicify_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    command: celery -A apps.api.worker.app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://voicify:password@db:5432/voicify_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres_data:
